
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Girls And Boys Video Call Apps</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">

    <header class="header">
      <h2>Girls And Boys</h2>
      <p>Connect with everyone</p>
    </header>

    <main id="loginSection" class="login-card">
      <h2>Welcome Back!</h2>
      <p>Login with your Google Account</p>

      <button id="googleLoginBtn">
        <span>G</span> Continue with Google
      </button>

      <p id="loginMessage"></p>
    </main>

    <main id="homeSection" hidden>
      <div class="profile-card">
        <img id="userPhoto" src="" alt="Profile">
        <h3 id="userName"></h3>
        <p id="userEmail"></p>
        <button id="logoutBtn">Logout</button>
      </div>

      <nav class="bottom-nav">
        <button id="activeTab">Active</button>
        <button id="chatTab">Chat</button>
        <button id="profileTab">Profile</button>
      </nav>

      <section id="activeSection">
        <h3>Active Users</h3>
        <div id="usersList">Loading users...</div>
      </section>

      
<section id="chatSection" hidden>
  <div class="chat-header">
    <button id="backToUsers">←</button>
    <img id="chatUserPhoto" src="" alt="User">
    <div>
      <h3 id="chatUserName">Select a User</h3>
      <p id="chatUserStatus">Personal Chat</p>
    </div>
  </div>

  <div id="chatList">
    <p>Select a user to start chatting.</p>
  </div>

  <div class="chat-input-area">
    <input
      type="text"
      id="messageInput"
      placeholder="Write a message..."
    >
    <button id="sendMessageBtn">Send</button>
  </div>
</section>


      <section id="profileSection" hidden>
        <h3>My Profile</h3>
        <p>Welcome to your profile.</p>
      </section>
    </main>

  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
