<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Call</title>
  <link rel="stylesheet" href="video-call.css">
</head>
<body>

  <div class="call-container">

    <div class="call-header">
      <h2>Video Call</h2>
      <p id="callStatus">Connecting...</p>
    </div>

    <div class="video-area">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay muted playsinline></video>
    </div>

    <div id="incomingCall" hidden>
      <p>Incoming Video Call...</p>
      <button id="acceptCallBtn">Accept</button>
      <button id="rejectCallBtn">Reject</button>
    </div>

    <div class="call-controls">
      <button id="muteBtn">🎤 Mute</button>
      <button id="cameraBtn">📷 Camera Off</button>
      <button id="endCallBtn">🔴 End Call</button>
    </div>

  </div>

  <script type="module" src="video-call.js"></script>
</body>
</html>
